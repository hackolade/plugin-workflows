name: Notify a direct push

# Reusable workflow: posts the pushed commit to Slack when the pusher is the account named by
# `commit-push-source`, i.e. a push straight to the branch rather than a merged pull request.
# Typically called on `push: branches: [develop]`.

on:
  workflow_call:
    inputs:
      channel-id:
        description: Slack channel to post to
        type: string
        default: develop-direct-pushes
    secrets:
      slack-bot-token:
        description: Slack bot token (SLACK_BOT_TOKEN)
        required: true
      commit-push-source:
        description: Pusher name that identifies a direct push (COMMIT_PUSH_SOURCE)
        required: true

permissions: {}

jobs:
  notify:
    name: Notify Slack of a direct push
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions: {}
    env:
      AUTHOR: ${{ github.event.pusher.name }}
      COMMIT_PUSH_SOURCE: ${{ secrets.commit-push-source }}
    steps:
      - name: Post to Slack
        if: env.AUTHOR == env.COMMIT_PUSH_SOURCE
        uses: slackapi/slack-github-action@dcb1066f776dd043e64d0e8ba94ca15cc7e1875d # v4.0.0
        with:
          method: chat.postMessage
          token: ${{ secrets.slack-bot-token }}
          errors: true
          payload: |
            {
              "channel": "${{ inputs.channel-id }}",
              "text": " ${{ github.event.head_commit.url }}",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "Push: ${{ github.event.head_commit.url }}"
                  }
                }
              ]
            }
